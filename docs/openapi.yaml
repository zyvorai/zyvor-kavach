            schema: {type: object}
  /v1/prevention/policies:
    get:
      summary: Prevention policies (detect-only)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Policies}}
    post:
      summary: POST /v1/prevention/policies
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
  /v1/hosts:
    get:
      summary: Host management inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Hosts}}
  /v1/host-groups:
    get:
