  /v1/adversaries/{id}:
    get:
      summary: One adversary profile plus per-technique coverage (exact, related or gap, covering rule ids, hits), coverage percent and gaps
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: "{mode, note, profile, coverage}"}, '401': {description: Unauthorized}, '404': {description: Not found}}
  /v1/content/custom:
    get:
      summary: List customer-authored content rules (source=custom); add tests=1 for samples
      security: [{bearerAuth: []}]
      parameters:
        - {name: tests, in: query, schema: {type: string, enum: ['1']}}
      responses: {'200': {description: "{mode, source, count, rules[]}"}, '401': {description: Unauthorized}}
    post:
      summary: Create or update a custom rule. Same schema and harness checks as embedded packs (own positive/negative samples, benign-baseline guard); never overrides an embedded id
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, description: "A content rule (see docs/content-framework.md); unknown fields rejected"}
      responses: {'200': {description: Saved}, '400': {description: Validation error naming the rule and check}, '409': {description: Id collides with an embedded rule}}
  /v1/content/custom/{id}:
    delete:
      summary: Delete a custom rule (embedded rules cannot be deleted)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Deleted}, '400': {description: Embedded rule}, '404': {description: Not found}}
  /v1/content/custom/{id}/dryrun:
    post:
      summary: Evaluate a custom rule against supplied events and return the matches; nothing is recorded as a finding
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, description: "{events: [lab events] (1..1000)}"}
      responses: {'200': {description: "{rule, evaluated, matched, matches[], findings_recorded: 0}"}, '404': {description: Not found}}
  /v1/rules/health:
    get:
      summary: Per-rule health computed from stored findings (hits 24h/7d/30d, distinct hosts, last fired, trend, share, noisy score, silent). Ordered by lifecycle state then noisy score
      security: [{bearerAuth: []}]
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [draft, testing, production, retired]}}
        - {name: source, in: query, schema: {type: string, enum: [custom, embedded, builtin]}}
        - {name: silent, in: query, schema: {type: string, enum: ['1']}}
        - {name: noisy, in: query, schema: {type: string, enum: ['1']}}
        - {name: limit, in: query, schema: {type: integer}}
      responses: {'200': {description: "{mode, count, noisy_threshold, rules[]}"}, '401': {description: Unauthorized}}
  /v1/rules/health/{id}:
    get:
      summary: Health of one rule plus recent finding ids
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: "{health, recent_finding_ids[]}"}, '404': {description: Unknown rule}}
  /v1/rules/lifecycle/{id}:
    get:
      summary: Lifecycle state of a rule (default production when never set)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: "{lifecycle, explicit, states[]}"}}
    put:
      summary: Set a rule's lifecycle state. Affects reporting/ordering only, except testing, which records hits as shadow findings outside the main findings list. Journaled in the rule history
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [state], properties: {state: {type: string, enum: [draft, testing, production, retired]}, note: {type: string}}}
      responses: {'200': {description: Saved}, '400': {description: Bad state}, '404': {description: Unknown rule}}
  /v1/rules/history/{id}:
    get:
