        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Template fields as for POST"
      responses:
        "200": { description: "Updated template" }
        "400": { description: "Validation failed" }
        "403": { description: "Built-in template or not the admin token" }
        "404": { description: "Not found" }
    delete:
      summary: "Delete a custom case template (admin token only; built-ins are read-only)"
      x-auth: admin-token
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Deleted" }
        "403": { description: "Built-in template or not the admin token" }
        "404": { description: "Not found" }
  /v1/cases/{id}/workflow:
    get:
      summary: "Workflow view of a case: applied template, checklist progress and SLA"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Workflow view" }
        "404": { description: "Case not found" }
  /v1/cases/{id}/assign:
    post:
      summary: "Assign a case to an analyst (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"assignee\": \"<=80 chars\"}"
      responses:
        "200": { description: "Updated workflow view" }
        "400": { description: "Assignee too long" }
        "404": { description: "Case not found" }
  /v1/cases/{id}/apply-template:
    post:
      summary: "Apply a template to a case, creating its checklist and SLA (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"template_id\": \"...\"}"
      responses:
        "200": { description: "Updated workflow view" }
        "404": { description: "Template or case not found" }
  /v1/cases/{id}/checklist/{n}:
    post:
      summary: "Tick or untick checklist step n (1-based; admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"done\": true|false} (required)"
      responses:
        "200": { description: "Updated workflow view" }
        "400": { description: "Invalid step number or done missing" }
        "404": { description: "No such checklist step (apply a template first)" }
  /v1/case-workflow/journal:
    get:
      summary: "Hash-chained journal of case workflow actions (newest 200) with chain verification"
      responses:
        "200": { description: "{intact, first_broken_seq, reason, entries[]}" }
  /v1/chains:
    get:
      summary: "Correlated attack chains across findings, ranked by score"
      parameters:
        - { name: host, in: query, schema: { type: string }, description: "Restrict to one host" }
        - { name: min_score, in: query, schema: { type: number }, description: "Minimum chain score" }
        - { name: limit, in: query, schema: { type: integer }, description: "1-200, default 50" }
      responses:
        "200": { description: "{chains[], total, returned}" }
  /v1/chains/{id}:
    get:
      summary: "One attack chain"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Chain with linked case id if any" }
        "404": { description: "Not found" }
  /v1/chains/{id}/case:
    post:
      summary: "Open (or return the existing) case for a chain (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{created, case}" }
        "404": { description: "Chain not found" }
  /v1/content/versions:
    get:
      summary: "Embedded content snapshot history (newest first)"
      parameters:
        - { name: items, in: query, schema: { type: string }, description: "1 = include per-item hashes" }
      responses:
        "200": { description: "{mode, count, history_cap, snapshots[]}" }
  /v1/content/changes:
    get:
      summary: "Diff between two content snapshots (default: previous vs latest)"
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "Snapshot seq or ref" }
        - { name: to, in: query, schema: { type: string }, description: "Snapshot seq or ref, default latest" }
      responses:
        "200": { description: "{from, to, diff{added, removed, modified}}" }
        "404": { description: "Unknown from/to snapshot" }
  /v1/content/changelog:
    get:
      summary: "Human-readable changelog entry per snapshot (newest first)"
      responses:
        "200": { description: "Changelog entries" }
  /v1/coverage/telemetry:
    get:
      summary: "Per-category telemetry inventory (live, nothing stored)"
      parameters:
        - { name: stale_days, in: query, schema: { type: integer }, description: "1-3650; a category silent for longer is stale" }
      responses:
        "200": { description: "{mode, caveat, stale_after_hours, categories[]}" }
  /v1/coverage/blindspots:
    get:
      summary: "Detection blind-spot report: telemetry gaps against rules, with optional validation run"
      parameters:
        - { name: stale_days, in: query, schema: { type: integer }, description: "1-3650" }
        - { name: validation, in: query, schema: { type: string }, description: "0 = skip the built-in validation run" }
      responses:
        "200": { description: "Blind-spot report" }
  /v1/detections/scheduled:
    get:
      summary: "List scheduled detections"
      responses:
        "200": { description: "{detections[], count, limits}" }
    post:
      summary: "Create a scheduled detection (admin or session)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "name, source (saved search or kavach-seq query), interval_sec (60-86400), severity, technique, state, max_matches, max_runtime_ms, dedup_window_sec"
      responses:
        "201": { description: "Created detection (201)" }
        "400": { description: "Validation failed" }
        "429": { description: "max_scheduled quota reached" }
  /v1/detections/scheduled/{id}:
    get:
      summary: "One scheduled detection with running flag"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{detection, running, ...}" }
        "404": { description: "Not found" }
    put:
      summary: "Update a scheduled detection (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Any subset of the POST fields"
      responses:
        "200": { description: "Updated detection" }
        "400": { description: "Validation failed" }
        "404": { description: "Not found" }
    delete:
      summary: "Delete a scheduled detection (admin or session); findings already recorded are kept"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{deleted, findings_already_recorded_kept}" }
        "404": { description: "Not found" }
  /v1/detections/scheduled/{id}/dryrun:
    post:
      summary: "Run now without recording anything (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Run result; 'recorded' is what WOULD be reported" }
        "404": { description: "Not found" }
  /v1/detections/scheduled/{id}/run:
    post:
      summary: "Run now and record findings (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Run result" }
        "404": { description: "Not found" }
        "429": { description: "max_runs_per_hour reached" }
  /v1/detections/scheduled/{id}/history:
    get:
      summary: "Run history of a scheduled detection"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{id, history[], retention}" }
        "404": { description: "Not found" }
  /v1/hunts/limits:
    get:
      summary: "Hunt quotas, current usage and refusal log"
      responses:
        "200": { description: "{limits, usage, refused{counts, recent}, env[]}" }
    put:
      summary: "Change hunt quotas (admin token only)"
      x-auth: admin-token
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "max_scheduled 1-500, max_runs_per_hour 1-3600, max_matches_per_run 1-1000, history_retention 1-500"
      responses:
        "200": { description: "Updated limits" }
        "400": { description: "Value out of range" }
        "403": { description: "Admin token required" }
  /v1/exceptions:
    get:
      summary: "List rule exceptions (all have an expiry)"
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Filter by status, e.g. active or expired" }
      responses:
        "200": { description: "{exceptions[], count, ...}" }
    post:
      summary: "Create an exception (admin or session)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "rule, host, path, reason, owner, expires (RFC3339, max 365 days)"
      responses:
        "201": { description: "Created exception" }
        "400": { description: "Invalid body, expiry or scope" }
        "429": { description: "Too many active exceptions" }
  /v1/exceptions/history:
    get:
      summary: "Hash-chained exception change history"
      responses:
        "200": { description: "{history[], chain_ok, broken_at_seq}" }
  /v1/exceptions/suppressed:
    get:
      summary: "Findings suppressed by exceptions (reporting only; nothing is blocked)"
      parameters:
        - { name: exception, in: query, schema: { type: string }, description: "Exception id" }
      responses:
        "200": { description: "{suppressed[], counts, total_suppressed}" }
  /v1/exceptions/{id}:
    put:
      summary: "Update an exception, or set expire_now (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Any subset of the POST fields plus expire_now"
      responses:
        "200": { description: "Updated exception" }
        "400": { description: "Invalid body" }
        "404": { description: "Not found" }
    delete:
      summary: "Delete an exception (admin or session); suppressed findings are kept"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{deleted, suppressed_findings_kept}" }
        "404": { description: "Not found" }
  /v1/reports/scheduled:
    get:
      summary: "List report schedules with limits and delivery note (pull-only)"
      responses:
        "200": { description: "{schedules[], templates_with_host_names, delivery, limits, redaction}" }
    post:
      summary: "Create a report schedule (admin or session)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Schedule: template, params, frequency, retention, format"
      responses:
        "201": { description: "Created schedule (201)" }
        "400": { description: "Validation failed" }
  /v1/reports/scheduled/{id}:
    put:
      summary: "Update a report schedule (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Schedule fields"
      responses:
        "200": { description: "Updated schedule" }
        "400": { description: "Validation failed" }
        "404": { description: "Not found" }
    delete:
      summary: "Delete a schedule and its archived reports (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "No content" }
        "404": { description: "Not found" }
  /v1/reports/scheduled/{id}/run:
    post:
      summary: "Render a schedule now (admin or session)"
      x-auth: admin-or-session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Run record" }
        "404": { description: "Not found" }
        "409": { description: "Run already in progress" }
        "500": { description: "Render failed" }
  /v1/reports/scheduled/{id}/runs:
    get:
      summary: "Runs of a schedule"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{schedule_id, runs[]}" }
        "404": { description: "Schedule not found" }
  /v1/reports/archive/{run_id}:
    get:
      summary: "Download a rendered report (md, json or csv; X-Kavach-Report-SHA256 header)"
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Report bytes" }
        "404": { description: "Report not found" }
  /v1/regression/status:
    get:
      summary: "Detection regression tracking: runner state, last run, next run, history size"
      responses:
        "200": { description: "Status; mode observe-only" }
  /v1/regression/history:
    get:
      summary: "Stored regression snapshots, newest first (capped at 90)"
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "Snapshots with per-tactic coverage, benign false positives and runtime" }
  /v1/regression/diff:
    get:
      summary: "Diff between two regression snapshots (regressions, improvements, added/removed scenarios, likely causes)"
      parameters:
        - { name: from, in: query, schema: { type: string }, description: "seq or 'previous' (default previous)" }
        - { name: to, in: query, schema: { type: string }, description: "seq or 'latest' (default latest)" }
      responses:
        "200": { description: "Diff; each regression carries a likely_cause hint" }
        "404": { description: "Fewer than two snapshots" }
  /v1/regression/trend:
    get:
      summary: "Measured coverage over time per tactic"
      parameters:
        - { name: window, in: query, schema: { type: string }, description: "7d, 30d or a Go duration" }
      responses:
        "200": { description: "Per-tactic series" }
  /v1/regression/run:
    post:
      summary: "Run the validation scenarios now (admin or session); records a snapshot and may record a regression-detected finding"
      x-auth: admin-or-session
      responses:
        "200": { description: "The new snapshot and its diff" }
        "409": { description: "A run is already in progress" }
  /v1/regression/config:
    get:
      summary: "Regression runner configuration"
      responses:
        "200": { description: "enabled, time (UTC HH:MM), max_runtime_sec, alert thresholds" }
    put:
      summary: "Update regression runner configuration (admin or session)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "enabled, time, max_runtime_sec (5..300), alert_min_regressions, alert_medium_at, alert_on_benign_fp"
      responses:
        "200": { description: "Updated configuration" }
        "400": { description: "Invalid value" }
  /v1/regression/gate:
    get:
      summary: "CI gate: pass/fail on measured coverage, regressions and benign false positives (HTTP 200 pass, 412 fail)"
      parameters:
        - { name: min_detected, in: query, schema: { type: number }, description: "Percent of claimed techniques measured Detected" }
        - { name: max_regressions, in: query, schema: { type: integer } }
        - { name: max_false_positives, in: query, schema: { type: integer } }
      responses:
        "200": { description: "Gate passed, with per-check detail" }
        "400": { description: "Bad parameters" }
        "412": { description: "Gate failed, or no run recorded yet (fails closed)" }
  /v1/fleet/slo:
    get:
      summary: "Fleet SLO report (heartbeat freshness, continuity, coverage)"
      responses:
        "200": { description: "SLO report" }
    put:
      summary: "Set SLO targets (admin token only)"
      x-auth: admin-token
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "heartbeat_fresh_minutes, heartbeat_target_pct, continuity_gap_minutes, continuity_target_pct, coverage_target_pct, window_hours"
      responses:
        "200": { description: "Updated config" }
        "400": { description: "Invalid JSON or value" }
        "403": { description: "Admin token required" }
  /v1/fleet/slo/definitions:
    get:
      summary: "How each SLO is computed"
      responses:
        "200": { description: "SLO definitions" }
  /v1/fleet/slo/history:
    get:
      summary: "SLO sample history"
      parameters:
        - { name: window, in: query, schema: { type: string }, description: "Duration 5m-72h, default 24h (e.g. 6h, 2d)" }
        - { name: agent, in: query, schema: { type: string }, description: "Restrict to one agent" }
      responses:
        "200": { description: "SLO history series" }
        "400": { description: "Bad window" }
        "404": { description: "No SLO history for that agent" }
  /v1/hunt/seq:
    post:
      summary: "Run a kavach-seq sequence/EQL-style hunt over retained events"
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"query\": \"...\", \"since\": \"24h|7d|RFC3339\", \"limit\": n}"
      responses:
        "200": { description: "{query, kind, count, matches[], truncated, timed_out, scan_capped, scanned, elapsed_ms, semantics}" }
        "400": { description: "Parse error (pos/line/col) or query uses unavailable fields" }
  /v1/hunt/seq/fields:
    get:
      summary: "Field catalogue, operators and limits for kavach-seq"
      responses:
        "200": { description: "{categories, join_keys, operators, notes, limits}" }
  /v1/hunt/seq/examples:
    get:
      summary: "Example kavach-seq queries"
      responses:
        "200": { description: "{count, examples[]}" }
  /v1/hunt/seq/explain:
    post:
      summary: "Parse and explain a query without running it"
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"query\": \"...\", \"since\": \"...\"}"
      responses:
        "200": { description: "{ok, kind, tree, unavailable_fields, semantics} (parse errors are returned with ok=false and pos/line/col)" }
        "400": { description: "Invalid JSON or since" }
  /v1/feedback:
    post:
      summary: "Record an analyst verdict on a finding (admin or session; hash-chained, nothing auto-applied)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "{\"finding_id\", \"verdict\": true_positive|false_positive|benign_expected|needs_more_data, \"note\"}"
      responses:
        "200": { description: "Recorded entry" }
        "400": { description: "Bad JSON, verdict or note too long" }
        "404": { description: "Unknown finding_id" }
    get:
      summary: "List feedback entries, newest first"
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: "1-1000, default 100" }
        - { name: finding_id, in: query, schema: { type: string } }
        - { name: rule, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
      responses:
        "200": { description: "{entries[]}" }
  /v1/feedback/verify:
    get:
      summary: "Verify the feedback hash chain"
      responses:
        "200": { description: "Chain verification result" }
  /v1/feedback/rules:
    get:
      summary: "Per-rule precision derived from feedback"
      responses:
        "200": { description: "Per-rule counts and precision" }
  /v1/feedback/summary:
    get:
      summary: "Feedback summary"
      responses:
        "200": { description: "Summary counts" }
  /v1/feedback/export:
    post:
      summary: "Export feedback as a labelled dataset download"
      parameters:
        - { name: redact, in: query, schema: { type: string }, description: "1 = pseudonymise hosts and drop notes" }
      responses:
        "200": { description: "Labelled dataset (Content-Disposition attachment kavach-feedback-labels.json)" }
  /v1/inspect/file:
    post:
      summary: "Inspect a file (observe-only static analysis; nothing is executed)"
      parameters:
        - { name: name, in: query, schema: { type: string }, description: "Display file name" }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string }
        description: "raw bytes (application/octet-stream); ?name= optional"
      responses:
        "200": { description: "Inspection report" }
        "400": { description: "Empty input or invalid JSON" }
        "413": { description: "Input larger than the inspect limit" }
  /v1/inspect/script:
    post:
      summary: "Inspect a script (observe-only static analysis; nothing is executed)"
      requestBody:
        content:
          text/plain:
            schema: { type: string }
        description: "raw text or {\"text\": ...}"
      responses:
        "200": { description: "Inspection report" }
        "400": { description: "Empty input or invalid JSON" }
        "413": { description: "Input larger than the inspect limit" }
  /v1/inspect/cmdline:
    post:
      summary: "Inspect a cmdline (observe-only static analysis; nothing is executed)"
      requestBody:
        content:
          text/plain:
            schema: { type: string }
        description: "raw text or {\"text\": ...}"
      responses:
        "200": { description: "Inspection report" }
        "400": { description: "Empty input or invalid JSON" }
        "413": { description: "Input larger than the inspect limit" }
  /v1/inspect/domain:
    post:
      summary: "Inspect a domain (observe-only static analysis; nothing is executed)"
      requestBody:
        content:
          text/plain:
            schema: { type: string }
        description: "raw text or {\"text\": ...} (one domain)"
      responses:
        "200": { description: "Inspection report" }
        "400": { description: "Empty input or invalid JSON" }
        "413": { description: "Input larger than the inspect limit" }
  /v1/inspect/config:
    post:
      summary: "Inspect a config (observe-only static analysis; nothing is executed)"
      requestBody:
        content:
          text/plain:
            schema: { type: string }
        description: "raw text or {\"text\": ...} (configuration file, parse-only)"
      responses:
        "200": { description: "Inspection report" }
        "400": { description: "Empty input or invalid JSON" }
        "413": { description: "Input larger than the inspect limit" }
  /v1/inspect/reports:
    get:
      summary: "Recent inspection reports (no input bytes)"
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: "Max reports" }
      responses:
        "200": { description: "{count, reports[], mode}" }
  /v1/inspect/analyzers:
    get:
      summary: "Registered analyzers and the input size limit"
      responses:
        "200": { description: "{analyzers[], max_bytes, mode}" }
  /v1/inspect/similar:
    get:
      summary: "Similar previously-inspected files by fuzzy digest"
      parameters:
        - { name: sha256, in: query, schema: { type: string }, description: "Query by a known report sha256" }
        - { name: digest, in: query, schema: { type: string }, description: "Or a kavach-ctph1:... / kavach-lsh1:... digest" }
        - { name: limit, in: query, schema: { type: integer }, description: "1-50, default 10" }
      responses:
        "200": { description: "Similarity matches" }
        "400": { description: "Malformed or unsupported digest" }
        "404": { description: "Unknown sha256" }
  /v1/ml/status:
    get:
      summary: "Local behaviour model status"
      responses:
        "200": { description: "Model status" }
  /v1/ml/lineage:
    get:
      summary: "Process-lineage transition statistics"
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "Lineage edges" }
