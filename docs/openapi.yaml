      security: [{bearerAuth: []}]
      responses: {'200': {description: Output}}
  /v1/device-control:
    get:
      summary: USB/device control events
      security: [{bearerAuth: []}]
      responses: {'200': {description: Devices}}
    post:
      summary: POST /v1/device-control
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
      requestBody:
        content:
          application/json:
