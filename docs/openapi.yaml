      summary: List scheduled hunts
      security: [{bearerAuth: []}]
      responses: {'200': {description: Schedules}}
    post:
      summary: Create scheduled hunt
      security: [{bearerAuth: []}]
      responses: {'201': {description: Created}}
    delete:
      summary: Delete scheduled hunt (query id)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Deleted}}
  /v1/hunts/history:
