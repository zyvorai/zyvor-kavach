      responses: {'200': {description: "{pack: export, rules[]} including samples"}}
  /v1/content/import:
    post:
      summary: Import a rule pack, or Sigma-subset rules with format=sigma. Per-rule results; rules that fail the harness or use unsupported Sigma constructs are reported, not guessed
      security: [{bearerAuth: []}]
      parameters:
        - {name: validate_only, in: query, schema: {type: boolean}, description: Run every check but store nothing}
        - {name: format, in: query, schema: {type: string, enum: [kavach, sigma]}}
      requestBody:
        content:
          application/json:
            schema: {type: object, description: "kavach: {pack, rules[]}. sigma: one rule object / array (JSON) or YAML documents separated by ---"}
          application/yaml:
            schema: {type: string}
      responses: {'200': {description: "{imported, valid, rejected, unsupported, results[{id,status,errors,unsupported}]}"}, '400': {description: Bad body or no rule accepted}}
