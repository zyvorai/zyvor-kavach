    get:
      summary: v1 cnapp misconfigs
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/cnapp/workloads:
    get:
      summary: v1 cnapp workloads
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/attack/matrix:
    get:
      summary: MITRE ATT&CK coverage matrix and observed hits (observe-only)
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/lab/rules:
    get:
      summary: List detection-lab rules (sandbox only; never promoted to live detection)
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK, mode sandbox}}
    post:
      summary: Create or update (upsert by id) a lab rule; validated, max 200 rules, mode always sandbox
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, description: "id, name, technique (T1059[.004]), enabled, condition {field,op,value|values | all|any|not}, threshold {count, within_seconds, group_by}"}
      responses: {'200': {description: Saved}, '400': {description: Validation error naming the field}, '409': {description: Rule cap reached}}
    delete:
      summary: Delete a lab rule
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Deleted}, '404': {description: Not found}}
  /v1/lab/rules/validate:
    post:
      summary: Validate a lab rule (operators equals|contains|startswith|endswith|regex(RE2, max 256 chars)|in)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Valid}, '400': {description: Invalid, error names the bad field}}
  /v1/lab/rules/test:
    post:
      summary: Run a rule (inline `rule` or `rule_id`) against up to 1000 sample `events`; returns per-event match and condition trace
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}, '400': {description: Bad rule or events}, '413': {description: Body too large}}
  /v1/lab/rules/backtest:
    post:
      summary: Replay a rule over stored events and findings (cap 50000); hit count, sample (max 20), top hosts, hits per day, noise per host per day
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}, '400': {description: Bad rule}, '404': {description: Unknown rule_id}}
  /v1/compliance/score:
    get:
      summary: Overall compliance grade across CIS/NIST/SOC2/ISO
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/compliance/controls:
    get:
      summary: Control-level compliance status with live evidence counts (observe-only, not certification)
      security: [{bearerAuth: []}]
      parameters:
        - {name: framework, in: query, schema: {type: string, enum: [cis-v8, nist-csf-2, soc2, iso27001, rbi, cert-in, dpdp]}}
      responses: {'200': {description: OK}, '400': {description: Unknown framework}}
  /v1/compliance/evidence:
    get:
      summary: Auditor-ready evidence pack (JSON or printable escaped HTML) with scope and limitations
      security: [{bearerAuth: []}]
      parameters:
        - {name: framework, in: query, schema: {type: string, enum: [cis-v8, nist-csf-2, soc2, iso27001, rbi, cert-in, dpdp]}}
        - {name: format, in: query, schema: {type: string, enum: [json, html]}}
      responses: {'200': {description: OK}, '400': {description: Bad framework or format}}
  /v1/compliance/cert-in-clock:
    get:
      summary: Open high/critical incidents against the 6-hour CERT-In window (informational)
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/governance/inventory:
    get:
      summary: Data inventory by class (location, record counts read from disk, oldest/newest, approximate bytes)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Inventory}}
  /v1/governance/retention:
    get:
      summary: Per-class max-age policy in days (default unlimited)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Policy}}
    post:
      summary: 'Set policy {"days":{"findings":30}}; min 1, null = unlimited; classes findings, process_events, network_events, file_events (admin or session)'
      security: [{bearerAuth: []}]
      responses: {'200': {description: Saved}, '400': {description: Invalid}}
  /v1/governance/retention/preview:
    post:
      summary: Dry-run purge counts using the saved policy (or an optional body override)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Would-purge counts}}
  /v1/governance/retention/apply:
    post:
      summary: 'Purge per policy; admin token only, body {"confirm":"purge"} required; audit line written'
      security: [{bearerAuth: []}]
      responses: {'200': {description: Purged counts}, '400': {description: Missing confirm}, '403': {description: Not admin}}
  /v1/governance/redaction:
    get:
      summary: Redaction rule list and export toggle
      security: [{bearerAuth: []}]
      responses: {'200': {description: Rules}}
    post:
      summary: 'Toggle redaction of /v1/export/findings {"enabled":true} (admin or session)'
      security: [{bearerAuth: []}]
      responses: {'200': {description: Saved}}
  /v1/governance/redact/preview:
