      responses: {'200': {description: Markdown}, '404': {description: Unknown template}}
  /v1/connectors:
    post:
      summary: "Register a connector definition (admin or session)"
      x-auth: admin-or-session
      requestBody:
        content:
          application/json:
            schema: { type: object }
        description: "Connector JSON"
      responses:
        "200": { description: "Registered connector" }
        "400": { description: "Invalid" }
    get:
      summary: Connector registry
      security: [{bearerAuth: []}]
      responses: {'200': {description: Connectors}}
  /v1/cloud/posture:
