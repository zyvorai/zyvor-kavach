        host: { type: string }
        pid: { type: integer }
        ppid: { type: integer }
        uid: { type: integer }
        executable: { type: string }
        command: { type: string }
        process_start: { type: string }
    NetworkEvent:
      type: object
      required: [time, host, pid]
      properties:
        time: { type: string, format: date-time }
        host: { type: string }
        pid: { type: integer }
        destination: { type: string }
        verdict: { type: string }
        process_start: { type: string }
        source: { type: string }
