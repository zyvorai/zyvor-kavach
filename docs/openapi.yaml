            schema: {type: object}
  /v1/containment:
    get:
      summary: Containment request ledger
      security: [{bearerAuth: []}]
      responses: {'200': {description: Requests}}
    post:
      summary: Record containment request (never enforced)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Recorded}}
  /v1/rtr/commands:
    get:
      summary: RTR read-only command allowlist
      security: [{bearerAuth: []}]
      responses: {'200': {description: Commands}}
  /v1/rtr/sessions:
    get:
