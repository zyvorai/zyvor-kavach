      security: [{bearerAuth: []}]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [nation-state, cybercrime, ransomware]}}
        - {name: technique, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses: {'200': {description: "{mode, note, count, adversaries[]}"}, '401': {description: Unauthorized}}
