      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: min_events, in: query, schema: { type: integer }, description: "4-100000" }
        - { name: min_score, in: query, schema: { type: number } }
        - { name: limit, in: query, schema: { type: integer }, description: "1-200, default 20" }
        - { name: exclude_private, in: query, schema: { type: string }, description: "1 or true" }
      responses:
        "200": { description: "Beacon candidates" }
  /v1/ml/priority:
    get:
