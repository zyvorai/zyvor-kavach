openapi: 3.0.3
info:
  title: Kavach API
  version: "1.0"
  description: Brief stub of live Kavach controller endpoints. Bearer auth unless noted.
servers:
  - url: https://127.0.0.1:8099
    description: Local / NodePort HTTPS
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: ok
  /v1/session:
    post:
      summary: Create console session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        "200":
          description: Session cookie set
  /v1/summary:
    get:
      summary: Finding counts by severity / host
      responses:
        "200":
          description: Summary JSON
  /v1/findings:
    get:
      summary: List findings
      parameters:
        - name: severity
          in: query
          schema: { type: string }
        - name: rule
          in: query
          schema: { type: string }
        - name: host
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Finding array
  /v1/recent-events:
    get:
      summary: Recent process and network events
      responses:
        "200":
          description: process / network buckets
  /v1/incidents:
    get:
      summary: Findings with workflow state
      responses:
        "200":
          description: Incident list
  /v1/incidents/transition:
    post:
      summary: Transition incident status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                finding_id: { type: string }
                status: { type: string, enum: [open, investigating, resolved, false_positive] }
                note: { type: string }
                actor: { type: string }
      responses:
        "200":
          description: Updated workflow
  /v1/fleet:
    get:
      summary: Fleet / agent status
      responses:
        "200":
          description: Agent status array
  /v1/agents:
    get:
      summary: List enrolled agents (admin)
      responses:
        "200":
          description: Agent status array
  /v1/agents/enroll:
    post:
      summary: Enroll host (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
      responses:
        "200":
          description: host + agent token
  /v1/agents/revoke:
    post:
      summary: Revoke host credentials (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
      responses:
        "204":
          description: Revoked
  /v1/agents/heartbeat:
    post:
      summary: Agent heartbeat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                sensor: { type: string }
                queued: { type: integer }
      responses:
        "204":
          description: Accepted
  /v1/events:
    post:
      summary: Ingest process event
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: findings count
  /v1/network-events:
    post:
      summary: Ingest Netra network event
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkEvent"
      responses:
        "200":
          description: correlations count
  /v1/file-events:
    post:
      summary: Ingest file-activity event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                time: { type: string, format: date-time }
                path: { type: string }
                operation: { type: string }
                pid: { type: integer }
      responses:
        "200":
          description: findings count
  /v1/siem/status:
    get:
      summary: SIEM exporter status
      responses:
        "200":
          description: Status JSON
  /v1/siem/export:
    get:
      summary: NDJSON / ECS findings export
      responses:
        "200":
          description: application/x-ndjson
  /v1/ai/score:
    get:
      summary: Assistive score for one finding
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Score object
  /v1/ai/scores:
    get:
      summary: Assistive scores for all findings
      responses:
        "200":
          description: Score array
  /v1/sensor:
    get:
      summary: Sensor / Netra / SIEM probe status
      responses:
        "200":
          description: Status JSON
/v1/modules:
    get:
      summary: CrowdStrike Falcon module capability map
      security: [{bearerAuth: []}]
      responses: {'200': {description: Module list}}
  /v1/detections:
    get:
      summary: Falcon-style detections with MITRE mapping
      security: [{bearerAuth: []}]
      responses: {'200': {description: Detections}}
  /v1/detections/triage:
    post:
      summary: Triage a detection
      security: [{bearerAuth: []}]
      responses: {'200': {description: Updated}}
  /v1/ioc:
    get:
      summary: IOC management list
      security: [{bearerAuth: []}]
      responses: {'200': {description: IOCs}}
    post:
      summary: Create detect-only IOC
      security: [{bearerAuth: []}]
      responses: {'200': {description: Created}}
  /v1/ioa:
    get:
      summary: Custom IOA rules
      security: [{bearerAuth: []}]
      responses: {'200': {description: IOAs}}
  /v1/prevention/policies:
    get:
      summary: Prevention policies (detect-only)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Policies}}
  /v1/hosts:
    get:
      summary: Host management inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Hosts}}
  /v1/host-groups:
    get:
      summary: Host groups
      security: [{bearerAuth: []}]
      responses: {'200': {description: Groups}}
  /v1/containment:
    get:
      summary: Containment request ledger
      security: [{bearerAuth: []}]
      responses: {'200': {description: Requests}}
    post:
      summary: Record containment request (never enforced)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Recorded}}
  /v1/rtr/commands:
    get:
      summary: RTR read-only command allowlist
      security: [{bearerAuth: []}]
      responses: {'200': {description: Commands}}
  /v1/rtr/sessions:
    get:
      summary: RTR sessions
      security: [{bearerAuth: []}]
      responses: {'200': {description: Sessions}}
    post:
      summary: Open RTR session
      security: [{bearerAuth: []}]
      responses: {'200': {description: Session}}
  /v1/rtr/execute:
    post:
      summary: Execute read-only RTR diagnostic
      security: [{bearerAuth: []}]
      responses: {'200': {description: Output}}
  /v1/device-control:
    get:
      summary: USB/device control events
      security: [{bearerAuth: []}]
      responses: {'200': {description: Devices}}
  /v1/firewall/rules:
    get:
      summary: Host firewall inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Rules}}
  /v1/discover/assets:
    get:
      summary: Falcon Discover asset inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Assets}}
  /v1/discover/apps:
    get:
      summary: Application inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Apps}}
  /v1/spotlight/vulnerabilities:
    get:
      summary: Spotlight CVE inventory
      security: [{bearerAuth: []}]
      responses: {'200': {description: Vulnerabilities}}
  /v1/overwatch/alerts:
    get:
      summary: OverWatch managed hunting alerts
      security: [{bearerAuth: []}]
      responses: {'200': {description: Alerts}}
  /v1/intel/actors:
    get:
      summary: Threat actor profiles
      security: [{bearerAuth: []}]
      responses: {'200': {description: Actors}}
  /v1/intel/indicators:
    get:
      summary: Intel indicators
      security: [{bearerAuth: []}]
      responses: {'200': {description: Indicators}}
  /v1/identity/events:
    get:
      summary: Identity threat events
      security: [{bearerAuth: []}]
      responses: {'200': {description: Events}}
  /v1/identity/entities:
    get:
      summary: Identity entities with risk
      security: [{bearerAuth: []}]
      responses: {'200': {description: Entities}}
  /v1/ueba:
    get:
      summary: UEBA entity scores
      security: [{bearerAuth: []}]
      responses: {'200': {description: Scores}}
  /v1/fusion/playbooks:
    get:
      summary: Fusion SOAR playbooks
      security: [{bearerAuth: []}]
      responses: {'200': {description: Playbooks}}
  /v1/fusion/runs:
    get:
      summary: Fusion playbook runs
      security: [{bearerAuth: []}]
      responses: {'200': {description: Runs}}
  /v1/cases:
    get:
      summary: Case management
      security: [{bearerAuth: []}]
      responses: {'200': {description: Cases}}
    post:
      summary: Create case
      security: [{bearerAuth: []}]
      responses: {'200': {description: Created}}
  /v1/hunt/query:
    post:
      summary: FQL-lite threat hunt
      security: [{bearerAuth: []}]
      responses: {'200': {description: Hunt results}}
  /v1/threat-graph:
    get:
      summary: Threat correlation graph
      security: [{bearerAuth: []}]
      responses: {'200': {description: Graph}}
  /v1/audit:
    get:
      summary: Audit log
      security: [{bearerAuth: []}]
      responses: {'200': {description: Entries}}
  /v1/reports/summary:
    get:
      summary: SOC summary report
      security: [{bearerAuth: []}]
      responses: {'200': {description: Summary}}
  /v1/connectors:
    get:
      summary: Connector registry
      security: [{bearerAuth: []}]
      responses: {'200': {description: Connectors}}
  /v1/cloud/posture:
    get:
      summary: Cloud CSPM posture (preview)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Controls}}
  /v1/mobile/devices:
    get:
      summary: Mobile devices (preview)
      security: [{bearerAuth: []}]
      responses: {'200': {description: Devices}}
  /v1/ai/assist:
    post:
      summary: Charlotte-lite assistive triage
      security: [{bearerAuth: []}]
      responses: {'200': {description: Answer}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Event:
      type: object
      required: [time, host, pid, executable, command]
      properties:
        time: { type: string, format: date-time }
        host: { type: string }
        pid: { type: integer }
        ppid: { type: integer }
        uid: { type: integer }
        executable: { type: string }
        command: { type: string }
        process_start: { type: string }
    NetworkEvent:
      type: object
      required: [time, host, pid]
      properties:
        time: { type: string, format: date-time }
        host: { type: string }
        pid: { type: integer }
        destination: { type: string }
        verdict: { type: string }
        process_start: { type: string }
        source: { type: string }
