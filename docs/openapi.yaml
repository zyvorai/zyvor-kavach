  /v1/alerts/rules:
    get:
      summary: List alert rules
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
    post:
      summary: Create an alert rule (webhook or slack destination; https only, private IPs rejected)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                min_severity: {type: string, enum: [low, medium, high, critical], default: high}
                rule_contains: {type: string}
                host_contains: {type: string}
                type: {type: string, enum: [webhook, slack], default: webhook}
                url: {type: string}
      responses: {'201': {description: Created}, '400': {description: Invalid rule}}
    delete:
      summary: Delete an alert rule by ?id=
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {'204': {description: Deleted}, '404': {description: Not found}}
