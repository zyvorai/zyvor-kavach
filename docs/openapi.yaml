        - { name: host, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer }, description: "1-500, default 50" }
      responses:
        "200": { description: "{mode, model, weights, note, priority|items}" }
        "404": { description: "Finding not found" }
