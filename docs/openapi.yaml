      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: "{rule, count, chain_ok, broken_at_seq, entries[]}"}}
  /v1/content/export:
    post:
      summary: Export rules as a JSON pack (read-only). Filter by source (custom default, embedded, all), ids, tactic, technique, os, batch, q, event_type
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
