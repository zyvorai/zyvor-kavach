      security: [{bearerAuth: []}]
      responses: {'200': {description: Alerts}}
    post:
      summary: POST /v1/overwatch/alerts
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
  /v1/intel/actors:
    get:
      summary: Threat actor profiles
      security: [{bearerAuth: []}]
      responses: {'200': {description: Actors}}
  /v1/intel/indicators:
    get:
      summary: Intel indicators
      security: [{bearerAuth: []}]
      responses: {'200': {description: Indicators}}
  /v1/identity/events:
    get:
      summary: Identity threat events
      security: [{bearerAuth: []}]
      responses: {'200': {description: Events}}
    post:
      summary: POST /v1/identity/events
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
  /v1/identity/entities:
    get:
      summary: Identity entities with risk
      security: [{bearerAuth: []}]
      responses: {'200': {description: Entities}}
  /v1/identity/itdr/summary:
    get:
      summary: ITDR summary
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/identity/itdr/indicators:
    get:
      summary: ITDR indicators (credential dumping, kerberoasting, pass-the-hash, impossible travel, odd-hour login, privileged usage)
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/identity/itdr/risk:
    get:
      summary: ITDR per-user risk scores
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/identity/itdr/privileged:
    get:
      summary: ITDR privileged accounts
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/identity/itdr/timeline:
    get:
      summary: ITDR user timeline (query user)
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /v1/ueba:
    get:
      summary: UEBA entity scores
      security: [{bearerAuth: []}]
      responses: {'200': {description: Scores}}
  /v1/fusion/playbooks:
    get:
      summary: Fusion SOAR playbooks
      security: [{bearerAuth: []}]
      responses: {'200': {description: Playbooks}}
    post:
      summary: POST /v1/fusion/playbooks
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
      requestBody:
