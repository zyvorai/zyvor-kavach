      responses: {'200': {description: OK}}
  /v1/search:
    get:
      summary: Global search across findings, hosts, content rules, hunt packs, queries, guidance, ATT&CK techniques, CVEs, IOCs, cases and saved searches. Plain substring match (no regex); results scored exact id > prefix > substring, each with a console route hint
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, required: true, description: "At least 2 characters; truncated at 128", schema: {type: string}}
        - {name: types, in: query, description: "Comma-separated filter", schema: {type: string, example: "finding,host,rule,huntpack,query,guidance,technique,cve,ioc,case,saved"}}
        - {name: limit, in: query, description: "Default 20, max 100", schema: {type: integer}}
      responses: {'200': {description: "{query, count, results[{type,id,title,subtitle,score,route}]}"}, '400': {description: Bad q or unknown type}, '401': {description: Unauthorized}}
  /v1/adversaries:
    get:
