<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kavach hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Shield mark is hand-drawn SVG. The code rain is generated from a fixed seed so every render matches.
  One rain column reads 4B 41 56 41 43 48: "KAVACH" in ASCII hex.
  Build: ./docs/social/build-hero-dark.sh  ->  kavach-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  #rain { position:absolute; left:470px; top:0; width:730px; height:630px; overflow:hidden;
    -webkit-mask-image:radial-gradient(460px 330px at 58% 50%, rgba(0,0,0,1) 30%, rgba(0,0,0,.55) 62%, transparent 100%); }
  .col { position:absolute; top:0; width:16px; font-family:var(--mono); font-size:15px; line-height:17px; text-align:center; white-space:pre; }
  .col span { display:block; }
  .col .h { color:#e8fff0; text-shadow:0 0 8px #7dffb0, 0 0 16px var(--green); }
  .mk { z-index:6; }
  #kavach { left:1170px; top:22px; }
  .mk span { color:#bff1ff; text-shadow:0 0 6px var(--cyan), 0 0 14px var(--cyan), 0 0 26px var(--signal); font-weight:700; }
  .mk span.gap { color:transparent; text-shadow:none; }
  .aurora { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(520px 360px at 77% 50%, rgba(0,113,227,.30), transparent 65%),
               radial-gradient(540px 420px at 0% 100%, rgba(0,113,227,.22), transparent 60%),
               linear-gradient(90deg, #000 0%, #000 38%, rgba(0,0,0,.6) 46%, transparent 56%); }
  .left { position:absolute; left:60px; top:52px; width:520px; z-index:5; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:96px; line-height:.95; font-weight:800; letter-spacing:-.05em; padding-bottom:6px;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin:14px 0 0; font-size:28px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:480px; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:5; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  #shield { position:absolute; left:620px; top:70px; width:520px; height:480px; z-index:4; }
  .lbl { font-family:'SF Mono',Menlo,monospace; font-size:13px; font-weight:700; letter-spacing:.08em; fill:#cfe6ff; }
</style>
</head>
<body>
<div id="rain"></div>
<div class="aurora"></div>
<div id="kavach" class="col mk"></div>

<svg id="shield" viewBox="0 0 520 480" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#2997ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#0071e3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset=".45" stop-color="#7eb6f0"/>
      <stop offset="1" stop-color="#0a3d8f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <ellipse cx="260" cy="220" rx="210" ry="190" fill="url(#glow)"/>

  <g stroke="#2997ff" stroke-opacity=".55" stroke-width="1.2" fill="none">
    <line x1="260" y1="28" x2="260" y2="78"/>
    <line x1="80" y1="120" x2="140" y2="150"/>
    <line x1="440" y1="120" x2="380" y2="150"/>
    <line x1="100" y1="380" x2="160" y2="330"/>
    <line x1="420" y1="380" x2="360" y2="330"/>
  </g>
  <g fill="#64d2ff">
    <circle cx="260" cy="28" r="4"/>
    <circle cx="80" cy="120" r="4"/><circle cx="440" cy="120" r="4"/>
    <circle cx="100" cy="380" r="4"/><circle cx="420" cy="380" r="4"/>
  </g>
  <text class="lbl" x="260" y="18" text-anchor="middle">EDR</text>
  <text class="lbl" x="70" y="112" text-anchor="end">XDR</text>
  <text class="lbl" x="450" y="112">eBPF</text>
  <text class="lbl" x="88" y="400" text-anchor="end">mTLS</text>
  <text class="lbl" x="432" y="400">SIEM</text>

  <path d="M260,70 C340,70 400,95 420,130 C440,170 430,280 260,400 C90,280 80,170 100,130 C120,95 180,70 260,70 Z"
        fill="url(#face)" stroke="url(#rim)" stroke-width="6" opacity=".95"/>
  <path d="M260,70 C340,70 400,95 420,130 C440,170 430,280 260,400 C90,280 80,170 100,130 C120,95 180,70 260,70 Z"
        fill="none" stroke="#2997ff" stroke-width="14" opacity=".35" filter="url(#bloom)"/>
  <path d="M180,160 L260,120 L340,160 L340,230 C340,290 300,330 260,350 C220,330 180,290 180,230 Z"
        fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".85"/>
  <text x="260" y="250" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="14" fill="#001a44" font-weight="700" opacity=".55">0x4B 41 56 41 43 48</text>
</svg>

<div class="left">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>endpoint &amp; cloud security</span></div>
  <div class="word">Kavach</div>
  <div class="tag">Security without<br><em>compromise.</em></div>
  <div class="lede">Unified endpoint, cloud and AI security — observation-first EDR with Netra XDR correlation for Linux and Kubernetes.</div>
  <div class="stats"><div class="stat"><b>EDR</b><span>observe</span></div><div class="stat"><b>XDR</b><span>Netra join</span></div><div class="stat"><b>mTLS</b><span>opt-in</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/zyvor-kavach</span><span>Zyvor Production</span></div>

<script>
(function () {
  var seed = 20261112;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var glyphs = [];
  for (var cp = 0x30A1; cp <= 0x30F6; cp++) glyphs.push(String.fromCharCode(cp));
  '0123456789ABCDEF'.split('').forEach(function (ch) { glyphs.push(ch); glyphs.push(ch); });
  var rain = document.getElementById('rain');
  var colW = 16, cols = Math.floor(730 / colW), rows = 38;
  for (var c = 0; c < cols; c++) {
    if (470 + c * colW > 1150 && 470 + c * colW < 1192) continue;
    var col = document.createElement('div');
    col.className = 'col';
    col.style.left = (c * colW) + 'px';
    var head = Math.floor(rnd() * (rows + 10)) - 4;
    var tail = 8 + Math.floor(rnd() * 22);
    var depth = 0.35 + rnd() * 0.65;
    for (var r = 0; r < rows; r++) {
      var s = document.createElement('span');
      s.textContent = glyphs[Math.floor(rnd() * glyphs.length)];
      var d = head - r;
      if (d === 0) { s.className = 'h'; s.style.opacity = depth.toFixed(2); }
      else if (d > 0 && d < tail) {
        var f = 1 - d / tail;
        var mix = r / rows;
        var g = Math.round(209 + (210 - 209) * mix), rr = Math.round(48 + (100 - 48) * mix), b = Math.round(88 + (255 - 88) * mix);
        s.style.color = 'rgba(' + rr + ',' + g + ',' + b + ',' + (f * 0.85 * depth).toFixed(2) + ')';
      } else {
        s.style.color = 'rgba(48,209,88,' + (0.04 + rnd() * 0.05).toFixed(2) + ')';
      }
      col.appendChild(s);
    }
    rain.appendChild(col);
  }
  var mk = document.getElementById('kavach');
  var code = ['4','B','','4','1','','5','6','','4','1','','4','3','','4','8'];
  for (var r = 0; r < 20; r++) {
    var sp = document.createElement('span');
    var idx = r - 2;
    if (idx >= 0 && idx < code.length) { sp.textContent = code[idx] || '.'; if (!code[idx]) sp.className = 'gap'; }
    else { sp.textContent = glyphs[Math.floor(rnd() * glyphs.length)]; sp.style.color = 'rgba(100,210,255,' + (r < 2 ? .25 : Math.max(.06, .4 - (idx - code.length) * .12)).toFixed(2) + ')'; sp.style.textShadow = 'none'; sp.style.fontWeight = '400'; }
    mk.appendChild(sp);
  }
})();
</script>
</body>
</html>
