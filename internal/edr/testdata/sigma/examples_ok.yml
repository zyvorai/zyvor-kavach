# Original example Sigma rules (written for Kavach tests, not copied from SigmaHQ).
title: Kavach Example Encoded PowerShell Launcher
kavach_id: ex-sigma-encoded-pwsh
description: Original example. PowerShell started with an encoded command argument from an Office parent.
level: high
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_arg:
    CommandLine|contains|windash: ' -encodedcommand '
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
  condition: selection_img and selection_arg and selection_parent
---
title: Kavach Example Certutil Remote Fetch
kavach_id: ex-sigma-certutil-fetch
description: Original example. certutil asked to fetch a remote URL to disk.
level: medium
tags: [attack.command_and_control, attack.t1105]
logsource:
  category: process_creation
  product: windows
detection:
  img:
    Image|endswith: '\certutil.exe'
  args:
    CommandLine|contains|all:
      - 'urlcache'
      - 'http'
  filter_local:
    CommandLine|contains: 'localhost'
  condition: img and args and not filter_local
---
title: Kavach Example Download Piped To Shell
kavach_id: ex-sigma-pipe-to-shell
description: Original example. A downloader piped straight into a shell, expressed with a 1 of quantifier and wildcards.
level: high
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  sel_curl:
    CommandLine: 'curl *| sh*'
  sel_wget:
    CommandLine: 'wget * | bash*'
  condition: 1 of sel_*
---
title: Kavach Example Base64 Encoded Marker String
kavach_id: ex-sigma-b64-marker
description: Original example. A fixed marker string passed base64 encoded at any alignment.
level: medium
tags:
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|base64offset|contains: 'kavach-example-marker'
  condition: selection
---
title: Kavach Example Onion Destination
kavach_id: ex-sigma-onion-dest
description: Original example. Connection to a .onion hostname.
level: high
tags:
  - attack.command_and_control
  - attack.t1090.003
logsource:
  category: network_connection
detection:
  selection:
    DestinationHostname|endswith: '.onion'
  condition: selection
---
title: Kavach Example Cron Drop Directory Write
kavach_id: ex-sigma-cron-drop
description: Original example. A hidden file created under the system cron drop-in directory.
level: medium
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  selection:
    TargetFilename|contains: '/etc/cron.d/.'
  filter_pkg:
    TargetFilename|endswith: '.dpkg-new'
  condition: selection and not filter_pkg
---
title: Kavach Example Run Key Pointing At User Temp
kavach_id: ex-sigma-runkey-temp
description: Original example. A Run key whose value launches something from a temp directory.
level: high
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  key:
    TargetObject|contains: '\CurrentVersion\Run\'
  value:
    Details|re: '\\appdata\\local\\temp\\[a-z0-9_]+\.(exe|scr)'
  condition: key and value
---
title: Kavach Example Dynamic DNS Lookup
kavach_id: ex-sigma-dyndns
description: Original example. Lookup of a name under a free dynamic DNS provider.
level: low
tags:
  - attack.command_and_control
  - attack.t1568
logsource:
  category: dns_query
detection:
  selection:
    QueryName|endswith:
      - '.duckdns.org'
      - '.ddns.net'
  condition: selection
---
title: Kavach Example Unverifiable Samples
kavach_id: ex-sigma-unverifiable
description: Original example whose samples cannot be derived (two constraints on one field that the synthesiser cannot order), so it starts in testing.
level: medium
tags:
  - attack.execution
  - attack.t1059
logsource:
  category: process_creation
detection:
  suffix:
    CommandLine|endswith: ' --kavach-example-quiet'
  prefix:
    CommandLine|startswith: 'kavach-example-run '
  condition: suffix and prefix
