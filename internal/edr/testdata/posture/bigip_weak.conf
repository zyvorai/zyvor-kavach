#TMSH-VERSION: 15.1.0.2

auth password-policy {
    policy-enforcement disabled
}
ltm profile client-ssl /Common/clientssl-legacy {
    ciphers RC4:3DES:DEFAULT
    defaults-from /Common/clientssl
}
ltm virtual /Common/vs_any {
    destination /Common/203.0.113.10:any
    ip-protocol tcp
    mask 255.255.255.255
    profiles {
        /Common/tcp { }
    }
}
net self /Common/self_ext {
    address 203.0.113.5/24
    allow-service all
    vlan /Common/external
}
net self /Common/self_ha {
    address 10.0.0.5/24
    allow-service {
        default
    }
}
sys httpd {
    allow { all }
    auth-pam-idle-timeout 86400
    ssl-protocol "all -SSLv2 -SSLv3"
}
sys sshd {
    allow { ALL }
    inactivity-timeout 0
}
sys snmp {
    communities {
        /Common/comm-1 {
            community-name public
            source default
        }
    }
}
