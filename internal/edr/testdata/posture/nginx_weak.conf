# nginx version: nginx/1.24.0
http {
    ignore_invalid_headers off;
    access_log off;
    server {
        listen 443 ssl;
        ssl_session_tickets on;
        location /s { stub_status; }
        location /p {
            proxy_pass http://$http_x_upstream;
        }
        location /q {
            proxy_pass https://api.internal;
        }
    }
}
