#TMSH-VERSION: 17.1.1.3

auth password-policy {
    policy-enforcement enabled
}
ltm profile client-ssl /Common/clientssl-modern {
    ciphers ECDHE+AES-GCM
}
ltm virtual /Common/vs_https {
    destination /Common/203.0.113.10:443
    ip-protocol tcp
}
net self /Common/self_ext {
    address 203.0.113.5/24
    allow-service none
}
sys httpd {
    allow { 10.10.0.0/24 }
    auth-pam-idle-timeout 900
    ssl-protocol "all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1"
}
sys sshd {
    allow { 10.10.0.5 }
    inactivity-timeout 600
}
sys syslog {
    remote-servers {
        /Common/siem {
            host 10.20.0.9
        }
    }
}
