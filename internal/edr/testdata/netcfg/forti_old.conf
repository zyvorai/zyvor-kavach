#config-version=FGT60F-7.4.3-FW-build2573:opmode=0:vdom=0
config system global
    set hostname "edge-fw"
end
config system interface
    edit "wan1"
        set vdom "root"
        set role wan
        set allowaccess ping
    next
end
config firewall address
    edit "web-srv"
        set subnet 10.1.0.10 255.255.255.255
    next
end
config firewall policy
    edit 2
        set name "block-telnet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "TELNET"
        set comments "no telnet out"
    next
    edit 4
        set name "web-in"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-srv"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set comments "published web"
    next
end
