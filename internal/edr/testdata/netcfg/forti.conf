#config-version=FGT60F-7.4.3-FW-build2573:opmode=0:vdom=0
config system global
    set admin-telnet enable
    set admin-https-ssl-versions tlsv1-1 tlsv1-2
    set hostname "edge-fw"
end
config system interface
    edit "wan1"
        set vdom "root"
        set role wan
        set allowaccess ping https ssh http
    next
    edit "internal"
        set vdom "root"
        set role lan
        set allowaccess ping https ssh
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2CanaryHashValue
    next
    edit "contractor"
        set accprofile "super_admin"
        set password Canary-Plain-Pass-9
        set trusthost1 10.0.0.0 255.0.0.0
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "wan1"
        set mode aggressive
        set proposal 3des-md5 aes128-sha256
        set dhgrp 2 14
        set psksecret ENC CanaryPskHash
    next
end
config firewall address
    edit "web-srv"
        set subnet 10.1.0.10 255.255.255.255
    next
    edit "web-srv-copy"
        set subnet 10.1.0.10 255.255.255.255
    next
    edit "unused-net"
        set subnet 10.77.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set name "allow-everything"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 2
        set name "block-telnet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "TELNET"
        set comments "no telnet out"
    next
    edit 3
        set name "inbound-smb"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "web-srv"
        set action accept
        set schedule "always"
        set service "SMB"
        set logtraffic all
        set comments "temp access, delete after 2025-12-01"
    next
end
