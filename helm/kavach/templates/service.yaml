apiVersion: v1
kind: Service
metadata:
  name: kavach
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kavach.selectorLabels" . | nindent 4 }}
  ports:
  - name: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
    port: {{ .Values.service.port }}
    targetPort: {{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
    {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
