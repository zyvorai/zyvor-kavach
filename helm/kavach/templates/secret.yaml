{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.token }}
{{- fail "Kavach requires auth.token (or auth.existingSecret). Token must be at least 8 characters." }}
{{- end }}
{{- if lt (len .Values.auth.token) 8 }}
{{- fail "auth.token must be at least 8 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: kavach-auth
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey | default "token" }}: {{ .Values.auth.token | quote }}
{{- end }}
