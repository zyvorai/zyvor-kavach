{{- /*
  First-class Envoy Gateway front door (Gateway API). Prefer this over classic
  Ingress (nginx Ingress is retiring) and over Cilium gatewayApi.* unless you
  explicitly want Cilium. Creates EnvoyProxy + Gateway + HTTPRoute + stable TLS
  + BackendTLSPolicy so Envoy can verify the HTTPS pod.
*/ -}}
{{- if .Values.envoyGateway.enabled }}
{{- $gwName := default .Release.Name .Values.envoyGateway.name }}
{{- $ns := .Release.Namespace }}
{{- $class := .Values.envoyGateway.gatewayClassName | default "eg" }}
{{- $proxyName := printf "%s-proxy" $gwName }}
{{- $tlsSecret := .Values.envoyGateway.tlsSecretName | default "kavach-tls" }}
{{- $caConfigMap := .Values.envoyGateway.caConfigMapName | default "kavach-ca" }}
{{- $httpsPort := int (.Values.envoyGateway.httpsPort | default 8443) }}
{{- $httpPort := int (.Values.envoyGateway.httpPort | default 8080) }}
{{- $httpsNodePort := int (.Values.envoyGateway.httpsNodePort | default 30943) }}
{{- $httpNodePort := int (.Values.envoyGateway.httpNodePort | default 30980) }}
{{- $hostname := .Values.envoyGateway.hostname | default (printf "kavach.%s.sslip.io" (regexReplaceAll "\\." (default "127.0.0.1" .Values.envoyGateway.addressHint) "-")) }}
{{- /* Stable self-signed cert: reuse existing Secret on upgrade so Envoy pinning survives. */ -}}
{{- $existing := lookup "v1" "Secret" $ns $tlsSecret }}
{{- $ca := genCA "Zyvor Kavach CA" 3650 }}
{{- $altNames := list "kavach" (printf "kavach.%s.svc" $ns) (printf "kavach.%s.svc.cluster.local" $ns) "localhost" $hostname }}
{{- $cert := genSignedCert "kavach" (list "127.0.0.1") $altNames 3650 $ca }}
{{- $tlsCrt := $cert.Cert }}
{{- $tlsKey := $cert.Key }}
{{- $caCrt := $ca.Cert }}
{{- if $existing }}
{{- $tlsCrt = index $existing.data "tls.crt" | b64dec }}
{{- $tlsKey = index $existing.data "tls.key" | b64dec }}
{{- if hasKey $existing.data "ca.crt" }}
{{- $caCrt = index $existing.data "ca.crt" | b64dec }}
{{- else }}
{{- $caCrt = $tlsCrt }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt | b64enc }}
  tls.key: {{ $tlsKey | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $caConfigMap }}
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
data:
  ca.crt: |
{{ $caCrt | indent 4 }}
---
# EnvoyProxy shapes the managed Envoy data plane (NodePort for lab access).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $proxyName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ .Values.envoyGateway.serviceType | default "NodePort" }}
        {{- if eq (.Values.envoyGateway.serviceType | default "NodePort") "NodePort" }}
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: https
                  protocol: TCP
                  port: {{ $httpsPort }}
                  targetPort: {{ $httpsPort }}
                  nodePort: {{ $httpsNodePort }}
                - name: http
                  protocol: TCP
                  port: {{ $httpPort }}
                  targetPort: {{ $httpPort }}
                  nodePort: {{ $httpNodePort }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  gatewayClassName: {{ $class | quote }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $proxyName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: {{ $httpsPort }}
      hostname: {{ $hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ $tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: {{ $httpPort }}
      hostname: {{ $hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gwName }}-app
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $ns }}
      sectionName: https
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.envoyGateway.path | default "/" | quote }}
      timeouts:
        request: {{ .Values.envoyGateway.requestTimeout | default "0s" | quote }}
      backendRefs:
        - name: kavach
          port: {{ .Values.service.port }}
{{- if .Values.envoyGateway.httpRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gwName }}-http-redirect
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $ns }}
      sectionName: http
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- if and .Values.tls.enabled (.Values.envoyGateway.backendTLS.enabled | default true) }}
---
apiVersion: {{ .Values.envoyGateway.backendTLS.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: BackendTLSPolicy
metadata:
  name: {{ $gwName }}-backend-tls
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kavach
  validation:
    hostname: {{ printf "kavach.%s.svc" $ns | quote }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ $caConfigMap }}
{{- end }}
{{- if .Values.envoyGateway.backendTrafficPolicy.enabled | default true }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $gwName }}-btp
  namespace: {{ $ns }}
  labels:
    {{- include "kavach.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $gwName }}-app
  useClientProtocol: {{ .Values.envoyGateway.backendTrafficPolicy.useClientProtocol | default true }}
{{- end }}
{{- end }}
